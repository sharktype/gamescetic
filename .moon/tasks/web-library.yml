$schema: "https://moonrepo.dev/schemas/v2/tasks.json"

inheritedBy:
    language: "typescript"
    layer: "library"
    stack: "frontend"

fileGroups:
    configs:
        - "/web/tsconfig*.json"
        - "tsconfig.json"
        - "package.json"
    sources:
        - "src/**/*"

tasks:
    test:
        command:
            - "vitest"
            - "run"
            - "--passWithNoTests"
        inputs:
            - "@group(configs)"
            - "@group(sources)"

    typecheck:
        command: "tsc --noEmit"
        inputs:
            - "@group(configs)"
            - "@group(sources)"
