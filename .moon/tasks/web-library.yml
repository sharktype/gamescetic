$schema: "https://moonrepo.dev/schemas/v2/tasks.json"

inheritedBy:
    stack: "frontend"
    layer: "library"

fileGroups:
    configs:
        - "/web/tsconfig*.json"

tasks:
    build:
        command: "pnpm run build"
        inputs:
            - "@group(configs)"
            - "@group(sources)"
