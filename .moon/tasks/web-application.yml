$schema: "https://moonrepo.dev/schemas/v2/tasks.json"

inheritedBy:
    stack: "frontend"
    layer: "application"

tasks:
    build:
        command: "pnpm run build"
        inputs:
            - "@group(configs)"
            - "@group(sources)"
        outputs:
            - "dist"

    dev:
        command: "pnpm run dev"

    preview:
        command: "pnpm run preview"
        deps:
            - "build"
        preset: "server"

    pnpm:
        command: "pnpm"
        preset: "utility"
