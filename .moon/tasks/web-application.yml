$schema: "https://moonrepo.dev/schemas/v2/tasks.json"

inheritedBy:
    stack: "frontend"
    layer: "application"

fileGroups:
    workspace:
        - "package.json"
        - "libs/*/package.json"
        - "pnpm-lock.yaml"
        - "pnpm-workspace.yaml"

tasks:
    install:
        command: "pnpm install"
        inputs:
            - "@group(workspace)"

    build:
        command: "pnpm run build"
        inputs:
            - "@group(configs)"
            - "@group(sources)"
        outputs:
            - "dist"

    dev:
        command: "pnpm run dev"

    preview:
        command: "pnpm run preview"
        deps:
            - "build"
        preset: "server"

    pnpm:
        command: "pnpm"
        preset: "utility"
