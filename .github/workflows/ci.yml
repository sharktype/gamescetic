name: Satchel CI/CD

on:
    workflow_dispatch:
    push:

concurrency:
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    group: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: read

jobs:
    test-go:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: satchel
                    POSTGRES_PASSWORD: satchel
                    POSTGRES_DB: satchel
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            CLIENTS_DB_TEST_DSN: postgres://satchel:satchel@localhost:5432/satchel?sslmode=disable
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  filter: blob:none
            - uses: moonrepo/setup-toolchain@v0
              with:
                  auto-install: true
                  auto-setup: true
            - run: moon run go:install
            - run: moon run go:install-tools
            - name: add Go tools to PATH
              run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
            - run: moon run go:build
            - run: moon run go:lint-check
            - run: moon run go:format-check
            - run: moon run go:audit
            - run: moon run go:test
              env:
                  CGO_ENABLED: "1"
            - name: run Go coverage
              working-directory: go
              run: go tool cover -func=coverage.out

    test-web:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  filter: blob:none
            - uses: moonrepo/setup-toolchain@v0
              with:
                  auto-install: true
                  auto-setup: true
            - run: moon run web:install
            - run: moon run web:build
            - run: moon run web:lint-check
            - run: moon run web:format-check
            - run: moon run web:biome-check
            - run: moon run web:typecheck
            - run: moon run web:test

    publish-go:
        needs: [test-go]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: build and push image
              run: |
                  docker build --tag "ghcr.io/${{ github.repository }}:latest" go
                  docker push "ghcr.io/${{ github.repository }}:latest"
