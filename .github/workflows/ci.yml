name: Gamescetic CI/CD

on:
    workflow_dispatch:
    push:

concurrency:
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    group: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: read

#
# Before deployment, you must:
#
# 1. Deploy your Railway service as pointing to the image.
# 2. Add the RAILWAY_TOKEN secret to your repository.
# 3. Make sure environment variables are set correctly at the Railway side.
#
# Note that if you're not forking and just using the image, you can just rely on automatic updates.
# You don't need to fork the repository or mess around with any of this.
#

env:
    RAILWAY_SERVICE: gamescetic-go

jobs:
    test-go:
        runs-on: ubuntu-24.04
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: gamescetic
                    POSTGRES_PASSWORD: gamescetic
                    POSTGRES_DB: gamescetic
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            CLIENTS_DB_TEST_DSN: postgres://gamescetic:gamescetic@localhost:5432/gamescetic?sslmode=disable
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  filter: blob:none
            - uses: moonrepo/setup-toolchain@v0
              with:
                  auto-install: true
                  auto-setup: true
            - uses: actions/cache@v6
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: ${{ runner.os }}-go-${{ hashFiles('go/go.sum', 'go/tools/go.sum') }}
                  restore-keys: |
                      ${{ runner.os }}-go-
            - run: moon run go:install
            - run: moon run go:install-tools
            - name: add Go tools to PATH
              run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
            - run: moon run go:build
            - run: moon run go:lint-check
            - run: moon run go:format-check
            - run: moon run go:audit
            - run: moon run go:test
              env:
                  CGO_ENABLED: "1"
            - name: run Go coverage
              working-directory: go
              run: go tool cover -func=coverage.out

    test-web:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  filter: blob:none
            - uses: moonrepo/setup-toolchain@v0
              with:
                  auto-install: true
                  auto-setup: true
            - uses: actions/cache@v6
              with:
                  path: ~/.local/share/pnpm/store
                  key: ${{ runner.os }}-pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-
            - run: moon run web:install
            - run: moon run web:build
            - run: moon run web:lint-check
            - run: moon run web:format-check
            - run: moon run web:biome-check
            - run: moon run web:typecheck
            - run: moon run web:test

    publish-go:
        needs: [test-go]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@v7
              with:
                  context: go
                  push: true
                  tags: ghcr.io/${{ github.repository }}-go:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy-go:
        needs: [publish-go]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: moonrepo/setup-toolchain@v0
            - run: npm i -g @railway/cli
            - name: redeploy from image source
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
              run: railway redeploy --yes --from-source --service "$RAILWAY_SERVICE"
