version: "2"
sql:
    - engine: "postgresql"
      queries: "sql/queries"
      schema: "sql/migrations"
      gen:
          go:
              package: "generated"
              out: "generated"
              sql_package: "pgx/v5"
              emit_interface: true

              # Without these, we need to deal with raw types like Text and check Valid.

              emit_pointers_for_null_types: true
              overrides:
                  - db_type: "timestamptz"
                    go_type:
                        import: "time"
                        type: "Time"
                  - db_type: "timestamptz"
                    nullable: true
                    go_type:
                        import: "time"
                        type: "Time"
                        pointer: true
